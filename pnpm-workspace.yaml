catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  # pinned: vite-plus 0.2.9 drops the `./binding` export that the (stale) latest
  # @voidzero-dev/vite-plus-test 0.1.24 still requires, so `vp config` — and with
  # it every `pnpm exec`/`vp run` — crashes. Unpin once the two versions line up.
  vite-plus: 0.2.7
minimumReleaseAgeExclude:
  - "@oxfmt/*"
  - oxfmt
  # tsv is published in lockstep with its platform packages; a bench that pins the
  # newest release shouldn't wait out the release-age window for it either.
  - "@fuzdev/*"
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  # Its postinstall only copies the platform binary into place; the harness
  # resolves `@oven/bun-<triple>` directly (`resolveBun`), so it needn't run.
  bun: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
minimumReleaseAgeExclude:
  - "@oxfmt/*"
  - oxfmt
  # tsv is published in lockstep with its platform packages; a bench that pins the
  # newest release shouldn't wait out the release-age window for it either.
  - "@fuzdev/*"
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

name: Update README

# Manual only, and the PR it opens is not auto-merged. The run itself is
# complete now — tsv installs from npm and the bench-svelte corpus is fetched at
# its pin — but it runs on a GitHub runner, whose core count differs sharply from
# a dev machine's, and since biome, oxfmt, and tsv all scale with cores while
# prettier does not, the ratios move with the hardware. Results are only
# comparable when every row comes from one machine, so the README is normally
# regenerated deliberately (`pnpm run update-readme` locally) rather than on a
# lockfile bump, and a runner-generated PR is reviewed as a whole-README swap,
# never merged as a refresh of a few rows.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    name: Update README
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the auto/update-readme branch.
      pull-requests: write # Create and auto-merge the README PR.
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: outline/outline
          path: bench-js-no-embedded/data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: outline/outline
          path: bench-ts-only/data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: storybookjs/storybook
          path: bench-mixed-embedded/data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: continuedev/continue
          path: bench-full-features/data

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: hyperfine

      # GNU time, for the memory rows — the README consumer refuses a scenario
      # without a memory section, so this is required here.
      - run: sudo apt-get install -y time

      # Setup is its own step: `vp run bench` never shells out to init.sh when a
      # corpus is missing, so that the run itself never touches the network.
      # Idempotent — it skips the corpora the checkout steps above already
      # placed and fetches the rest (parser.ts, the bench-svelte snapshot at its
      # pinned corpora commit) — and exits non-zero if the run still couldn't
      # start, so a failed fetch fails here rather than in the bench step.
      - run: ./init.sh

      - run: vp run update-readme

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto/update-readme
          delete-branch: true
          title: "chore: update benchmark results in README"
          commit-message: "chore: update benchmark results in README"
          body: |
            Benchmark results regenerated on a GitHub runner by a manual dispatch.
            Every row comes from that runner, so the README is comparable within
            itself — but not with rows measured elsewhere. Review as a whole swap.
          add-paths: README.md

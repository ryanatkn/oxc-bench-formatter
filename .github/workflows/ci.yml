name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These are not required step, but CI can be faster with cache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: outline/outline
          path: bench-js-no-embedded/data
      # bench-ts-only benches the same repo scoped to its non-JSX subset, in its
      # own checkout so each scenario resets its tree independently. tsv comes
      # from npm (@fuzdev/tsv's platform package, installed with the rest), so
      # every tsv scenario runs here too; bench-svelte's corpus is fetched from
      # the pinned fuzdev/corpora commit by init.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: outline/outline
          path: bench-ts-only/data
      # storybookjs/storybook's default branch contains gitlinks under .external/
      # without a .gitmodules file, which makes actions/checkout's post-job
      # submodule cleanup fail. Use a plain shallow clone instead.
      - run: git clone --depth=1 https://github.com/storybookjs/storybook.git bench-mixed-embedded/data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: continuedev/continue
          path: bench-full-features/data

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true

      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: hyperfine

      # GNU time, for the memory rows (skipped with a notice when absent).
      - run: sudo apt-get install -y time

      - run: vp run bench
